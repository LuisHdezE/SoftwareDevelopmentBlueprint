name: Blueprint API QA Package Validation
on:
  push:
    branches: [main, 'blueprint/**']
    paths:
      - 'templates/api-qa.example/**'
      - 'scripts/validate-api-qa-package.py'
      - 'scripts/test-api-qa-package.py'
      - 'scripts/run-api-qa-example.py'
      - '.github/workflows/blueprint-api-qa-package-validation.yml'
  pull_request:
    branches: [main, 'blueprint/**']
    paths:
      - 'templates/api-qa.example/**'
      - 'scripts/validate-api-qa-package.py'
      - 'scripts/test-api-qa-package.py'
      - 'scripts/run-api-qa-example.py'
      - '.github/workflows/blueprint-api-qa-package-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: [self-hosted, linux, x64, blueprint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - run: python scripts/test-api-qa-package.py
      - run: python scripts/run-api-qa-example.py
