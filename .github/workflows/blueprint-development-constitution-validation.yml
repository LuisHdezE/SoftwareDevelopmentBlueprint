name: Blueprint Development Constitution Validation
on:
  push:
    branches: [main, 'blueprint/**']
    paths:
      - 'catalog/development-constitution.proposal.yaml'
      - 'schemas/development-constitution.proposal.schema.json'
      - 'documentation/BF_OT_002_DEVELOPMENT_CONSTITUTION.md'
      - 'scripts/validate-development-constitution.py'
      - '.github/workflows/blueprint-development-constitution-validation.yml'
  pull_request:
    branches: [main, 'blueprint/**']
    paths:
      - 'catalog/development-constitution.proposal.yaml'
      - 'schemas/development-constitution.proposal.schema.json'
      - 'documentation/BF_OT_002_DEVELOPMENT_CONSTITUTION.md'
      - 'scripts/validate-development-constitution.py'
      - '.github/workflows/blueprint-development-constitution-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: [self-hosted, linux, x64, blueprint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install --disable-pip-version-check jsonschema==4.26.0 PyYAML==6.0.2
      - run: python scripts/validate-development-constitution.py
