name: Blueprint Mobile Licensing Validation

on:
  push:
    branches:
      - main
      - 'blueprint/**'
      - 'release/**'
    paths:
      - 'schemas/mobile-licensing.schema.json'
      - 'schemas/project.schema.json'
      - 'templates/mobile-licensing.example.yaml'
      - 'templates/project.example.yaml'
      - 'catalog/checks.yaml'
      - 'catalog/gates.yaml'
      - 'catalog/skills.yaml'
      - 'workflows/greenfield.yaml'
      - 'workflows/brownfield.yaml'
      - 'skills/dev-mobile-licensing/**'
      - 'tests/fixtures/mobile-licensing-boundary/**'
      - 'scripts/validate-mobile-licensing.py'
      - 'scripts/validate-mobile-licensing-boundary.py'
      - 'scripts/validate-release-v054.py'
      - '.github/workflows/blueprint-mobile-licensing-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'schemas/mobile-licensing.schema.json'
      - 'schemas/project.schema.json'
      - 'templates/mobile-licensing.example.yaml'
      - 'templates/project.example.yaml'
      - 'catalog/checks.yaml'
      - 'catalog/gates.yaml'
      - 'catalog/skills.yaml'
      - 'workflows/greenfield.yaml'
      - 'workflows/brownfield.yaml'
      - 'skills/dev-mobile-licensing/**'
      - 'tests/fixtures/mobile-licensing-boundary/**'
      - 'scripts/validate-mobile-licensing.py'
      - 'scripts/validate-mobile-licensing-boundary.py'
      - 'scripts/validate-release-v054.py'
      - '.github/workflows/blueprint-mobile-licensing-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, blueprint]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0 PyYAML==6.0.2
      - name: Validate mobile licensing contract and boundary
        run: |
          if [[ "$(cat VERSION)" == "0.5.4" && ! -f DEVELOPMENT_VERSION ]]; then
            python scripts/validate-release-v054.py --scope mobile-licensing
          else
            python scripts/validate-mobile-licensing.py
            python scripts/validate-mobile-licensing-boundary.py
          fi
