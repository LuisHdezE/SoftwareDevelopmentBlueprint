name: Blueprint Orchestration Preflight Validation
on:
  push:
    branches: [main, 'blueprint/**']
    paths:
      - 'scripts/orchestration-preflight.py'
      - 'scripts/test-orchestration-preflight.py'
      - 'scripts/validate-architecture-approval.py'
      - 'scripts/test-architecture-approval.py'
      - 'scripts/validate-agent-protocol.py'
      - 'schemas/task-packet.schema.json'
      - 'schemas/architecture-approval.proposal.schema.json'
      - 'catalog/architecture-decisions.proposal.json'
      - 'catalog/agent-policy-registry.proposal.json'
      - 'templates/agent-run.example/**'
      - '.github/workflows/blueprint-orchestration-preflight-validation.yml'
  pull_request:
    branches: [main, 'blueprint/**']
    paths:
      - 'scripts/orchestration-preflight.py'
      - 'scripts/test-orchestration-preflight.py'
      - 'scripts/validate-architecture-approval.py'
      - 'scripts/test-architecture-approval.py'
      - 'scripts/validate-agent-protocol.py'
      - 'schemas/task-packet.schema.json'
      - 'schemas/architecture-approval.proposal.schema.json'
      - 'catalog/architecture-decisions.proposal.json'
      - 'catalog/agent-policy-registry.proposal.json'
      - 'templates/agent-run.example/**'
      - '.github/workflows/blueprint-orchestration-preflight-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: [self-hosted, linux, x64, blueprint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install --disable-pip-version-check jsonschema==4.26.0 PyYAML==6.0.2 rfc3339-validator==0.1.4
      - run: python scripts/test-orchestration-preflight.py
      - run: python scripts/validate-agent-run.py templates/agent-run.example
      - run: python scripts/validate-agent-policy-registry.py
      - run: python scripts/test-architecture-approval.py
