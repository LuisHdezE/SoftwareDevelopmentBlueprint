name: Blueprint 0.5.5 Release Closure Validation

on:
  push:
    branches:
      - "blueprint/**"
    paths:
      - "VERSION"
      - "DEVELOPMENT_VERSION"
      - "README.md"
      - "documentation/BLUEPRINT_CURRENT_STATE.md"
      - "documentation/BLUEPRINT_V0_5_5_DEVELOPMENT.json"
      - "documentation/BLUEPRINT_V0_5_5_RELEASE_CANDIDATE.json"
      - "documentation/BLUEPRINT_V0_5_5_RELEASE_CANDIDATE.md"
      - "documentation/BLUEPRINT_V0_5_5_WEBBLUEPRINT_PILOT_MANIFEST.json"
      - "documentation/BLUEPRINT_V0_5_5_WEBBLUEPRINT_PILOT_REPORT.json"
      - "documentation/BLUEPRINT_V0_5_5_WEBBLUEPRINT_PILOT_REVIEW.md"
      - "scripts/validate-development.py"
      - "scripts/validate-release-closure-v055.py"
      - "scripts/validate-api-authority-v055-dev.py"
      - "scripts/validate-workflow-applicability-v055-dev.py"
      - "scripts/validate-client-slice-authority-v055-dev.py"
      - "scripts/validate-integration-qa-authority-v055-dev.py"
      - "scripts/validate-generic-compliance-v055-dev.py"
      - "scripts/validate-webblueprint-pilot-v055-dev.py"
      - ".github/workflows/blueprint-release-validation.yml"
      - ".github/workflows/blueprint-release-closure-v055-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "VERSION"
      - "DEVELOPMENT_VERSION"
      - "README.md"
      - "documentation/BLUEPRINT_CURRENT_STATE.md"
      - "documentation/BLUEPRINT_V0_5_5_DEVELOPMENT.json"
      - "documentation/BLUEPRINT_V0_5_5_RELEASE_CANDIDATE.json"
      - "documentation/BLUEPRINT_V0_5_5_RELEASE_CANDIDATE.md"
      - "documentation/BLUEPRINT_V0_5_5_WEBBLUEPRINT_PILOT_MANIFEST.json"
      - "documentation/BLUEPRINT_V0_5_5_WEBBLUEPRINT_PILOT_REPORT.json"
      - "documentation/BLUEPRINT_V0_5_5_WEBBLUEPRINT_PILOT_REVIEW.md"
      - "scripts/validate-development.py"
      - "scripts/validate-release-closure-v055.py"
      - "scripts/validate-api-authority-v055-dev.py"
      - "scripts/validate-workflow-applicability-v055-dev.py"
      - "scripts/validate-client-slice-authority-v055-dev.py"
      - "scripts/validate-integration-qa-authority-v055-dev.py"
      - "scripts/validate-generic-compliance-v055-dev.py"
      - "scripts/validate-webblueprint-pilot-v055-dev.py"
      - ".github/workflows/blueprint-release-validation.yml"
      - ".github/workflows/blueprint-release-closure-v055-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, blueprint]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0 PyYAML==6.0.2

      - name: Validate governed development and candidate closure
        run: python scripts/validate-development.py

      - name: Validate API authority model
        run: python scripts/validate-api-authority-v055-dev.py

      - name: Validate workflow and gate applicability
        run: python scripts/validate-workflow-applicability-v055-dev.py

      - name: Validate Client Architecture and Slice Authority
        run: python scripts/validate-client-slice-authority-v055-dev.py

      - name: Validate Integration QA Authority
        run: python scripts/validate-integration-qa-authority-v055-dev.py

      - name: Validate Generic Compliance Doctor
        run: python scripts/validate-generic-compliance-v055-dev.py --skip-prerequisites

      - name: Validate WebBlueprint non-normative pilot
        run: python scripts/validate-webblueprint-pilot-v055-dev.py

      - name: Validate release-candidate closure explicitly
        run: python scripts/validate-release-closure-v055.py
