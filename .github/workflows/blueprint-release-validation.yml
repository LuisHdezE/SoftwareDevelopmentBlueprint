name: Blueprint Release Validation

on:
  push:
    branches:
      - main
      - 'blueprint/**'
      - 'release/**'
    tags:
      - 'v*'
    paths:
      - VERSION
      - DEVELOPMENT_VERSION
      - README.md
      - BLUEPRINT.md
      - catalog/**
      - workflows/**
      - schemas/**
      - templates/**
      - skills/**
      - scripts/**
      - tests/**
      - ci/**
      - documentation/BLUEPRINT_CURRENT_STATE.md
      - documentation/BLUEPRINT_V0_4_RELEASE.json
      - documentation/BLUEPRINT_V0_4_RELEASE_NOTES.md
      - documentation/BLUEPRINT_V0_5_POST_API_AUDIT.md
      - documentation/BLUEPRINT_V0_5_EXTERNAL_AUDIT_RESPONSE.md
      - documentation/BLUEPRINT_V0_5_ROADMAP.md
      - documentation/BLUEPRINT_V0_5_RELEASE.json
      - documentation/BLUEPRINT_V0_5_RELEASE_NOTES.md
      - documentation/BLUEPRINT_V0_5_1_ARCHITECTURE_CONFORMANCE_HARDENING.md
      - documentation/BLUEPRINT_V0_5_1_RELEASE.json
      - documentation/BLUEPRINT_V0_5_1_RELEASE_NOTES.md
      - documentation/BLUEPRINT_V0_5_2_CI_EXECUTION_PORTABILITY.md
      - documentation/BLUEPRINT_V0_5_2_RELEASE.json
      - documentation/BLUEPRINT_V0_5_2_RELEASE_NOTES.md
      - documentation/BLUEPRINT_V0_5_3_MOBILE_LICENSING.md
      - documentation/BLUEPRINT_V0_5_3_RELEASE.json
      - documentation/BLUEPRINT_V0_5_3_RELEASE_NOTES.md
      - documentation/BLUEPRINT_V0_5_4_DEVELOPMENT.json
      - documentation/BLUEPRINT_V0_5_4_PLATFORM_CAPABILITIES.md
      - documentation/SELF_HOSTED_RUNNER_BOOTSTRAP.md
      - documentation/EXPERIENCE_ARTIFACT_MODEL.md
      - documentation/CLIENT_ARCHITECTURE_CONTRACT.md
      - documentation/SKILL_MODEL.md
      - .github/workflows/blueprint-release-validation.yml
      - .github/workflows/blueprint-ci-runtime-validation.yml
      - .github/workflows/blueprint-mobile-licensing-validation.yml
  pull_request:
    branches: [main]
    paths:
      - VERSION
      - DEVELOPMENT_VERSION
      - README.md
      - BLUEPRINT.md
      - catalog/**
      - workflows/**
      - schemas/**
      - templates/**
      - skills/**
      - scripts/**
      - tests/**
      - ci/**
      - documentation/BLUEPRINT_CURRENT_STATE.md
      - documentation/BLUEPRINT_V0_4_RELEASE.json
      - documentation/BLUEPRINT_V0_4_RELEASE_NOTES.md
      - documentation/BLUEPRINT_V0_5_POST_API_AUDIT.md
      - documentation/BLUEPRINT_V0_5_EXTERNAL_AUDIT_RESPONSE.md
      - documentation/BLUEPRINT_V0_5_ROADMAP.md
      - documentation/BLUEPRINT_V0_5_RELEASE.json
      - documentation/BLUEPRINT_V0_5_RELEASE_NOTES.md
      - documentation/BLUEPRINT_V0_5_1_ARCHITECTURE_CONFORMANCE_HARDENING.md
      - documentation/BLUEPRINT_V0_5_1_RELEASE.json
      - documentation/BLUEPRINT_V0_5_1_RELEASE_NOTES.md
      - documentation/BLUEPRINT_V0_5_2_CI_EXECUTION_PORTABILITY.md
      - documentation/BLUEPRINT_V0_5_2_RELEASE.json
      - documentation/BLUEPRINT_V0_5_2_RELEASE_NOTES.md
      - documentation/BLUEPRINT_V0_5_3_MOBILE_LICENSING.md
      - documentation/BLUEPRINT_V0_5_3_RELEASE.json
      - documentation/BLUEPRINT_V0_5_3_RELEASE_NOTES.md
      - documentation/BLUEPRINT_V0_5_4_DEVELOPMENT.json
      - documentation/BLUEPRINT_V0_5_4_PLATFORM_CAPABILITIES.md
      - documentation/SELF_HOSTED_RUNNER_BOOTSTRAP.md
      - documentation/EXPERIENCE_ARTIFACT_MODEL.md
      - documentation/CLIENT_ARCHITECTURE_CONTRACT.md
      - documentation/SKILL_MODEL.md
      - .github/workflows/blueprint-release-validation.yml
      - .github/workflows/blueprint-ci-runtime-validation.yml
      - .github/workflows/blueprint-mobile-licensing-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, blueprint]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0 PyYAML==6.0.2
      - name: Detect Blueprint validation mode
        id: validation-mode
        shell: bash
        run: |
          if [[ -f DEVELOPMENT_VERSION ]]; then
            echo "mode=development" >> "$GITHUB_OUTPUT"
          else
            echo "mode=stable" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate Blueprint stable release state
        if: steps.validation-mode.outputs.mode == 'stable'
        run: python scripts/validate-release.py
      - name: Validate Blueprint development hardening state
        if: steps.validation-mode.outputs.mode == 'development'
        run: python scripts/validate-development.py
