name: Blueprint Reuse Assessment Validation
on:
  push:
    branches: [main, 'blueprint/**']
    paths:
      - 'catalog/reuse-sources.proposal.json'
      - 'scripts/validate-reuse-assessment.py'
      - 'scripts/test-reuse-assessment.py'
      - 'scripts/validate-architecture-approval.py'
      - 'scripts/test-architecture-approval.py'
      - 'schemas/architecture-approval.proposal.schema.json'
      - 'catalog/architecture-decisions.proposal.json'
      - '.github/workflows/blueprint-reuse-assessment-validation.yml'
  pull_request:
    branches: [main, 'blueprint/**']
    paths:
      - 'catalog/reuse-sources.proposal.json'
      - 'scripts/validate-reuse-assessment.py'
      - 'scripts/test-reuse-assessment.py'
      - 'scripts/validate-architecture-approval.py'
      - 'scripts/test-architecture-approval.py'
      - 'schemas/architecture-approval.proposal.schema.json'
      - 'catalog/architecture-decisions.proposal.json'
      - '.github/workflows/blueprint-reuse-assessment-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: [self-hosted, linux, x64, blueprint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install --disable-pip-version-check jsonschema==4.26.0 rfc3339-validator==0.1.4
      - run: python scripts/test-reuse-assessment.py
      - run: python scripts/test-architecture-approval.py
