name: Blueprint Schema Validation

on:
  push:
    branches:
      - main
      - 'blueprint/**'
    paths:
      - 'schemas/**'
      - 'templates/**'
      - 'catalog/**'
      - 'workflows/**'
      - 'scripts/validate-experience-artifacts.py'
      - 'tests/fixtures/experience/**'
      - '.github/workflows/blueprint-schema-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'schemas/**'
      - 'templates/**'
      - 'catalog/**'
      - 'workflows/**'
      - 'scripts/validate-experience-artifacts.py'
      - 'tests/fixtures/experience/**'
      - '.github/workflows/blueprint-schema-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, blueprint]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0 PyYAML==6.0.2

      - name: Validate schemas, templates and experience semantics
        run: python scripts/validate-experience-artifacts.py
