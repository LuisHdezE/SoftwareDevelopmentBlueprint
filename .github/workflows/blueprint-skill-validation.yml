name: Blueprint Skill Validation

on:
  push:
    branches:
      - "blueprint/**"
      - "release/**"
    paths:
      - "catalog/skills.yaml"
      - "skills/**"
      - "scripts/validate-skills.py"
      - "scripts/validate-release-v054.py"
      - "documentation/SKILL_MODEL.md"
      - ".github/workflows/blueprint-skill-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "catalog/skills.yaml"
      - "skills/**"
      - "scripts/validate-skills.py"
      - "scripts/validate-release-v054.py"
      - "documentation/SKILL_MODEL.md"
      - ".github/workflows/blueprint-skill-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, blueprint]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0 PyYAML==6.0.2

      - name: Validate executable Blueprint skills
        run: |
          if [[ "$(cat VERSION)" == "0.5.4" && ! -f DEVELOPMENT_VERSION ]]; then
            python scripts/validate-release-v054.py --scope skills
          else
            python scripts/validate-skills.py
          fi
