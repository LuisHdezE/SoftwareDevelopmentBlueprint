name: Create v0.5.1 annotated tag

on:
  push:
    branches:
      - blueprint/release-v0.5.1
    paths:
      - .github/workflows/create-v0.5.1-tag.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout stable commit
        uses: actions/checkout@v7
        with:
          ref: ac8be4e3332b13cab7d27f12e6a62d5d60e9ff4e
          fetch-depth: 0
      - name: Create annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.5.1 >/dev/null 2>&1; then
            echo "v0.5.1 already exists; refusing to move it"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.5.1 ac8be4e3332b13cab7d27f12e6a62d5d60e9ff4e -m "Software Development Blueprint v0.5.1"
          git push origin refs/tags/v0.5.1
