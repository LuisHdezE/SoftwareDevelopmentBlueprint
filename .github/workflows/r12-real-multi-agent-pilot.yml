name: R12 Real Multi-Agent Pilot

on:
  push:
    branches:
      - governance/evidence/r12-agent-protocol-readme
    paths:
      - 'pilots/R12/**'
      - '.github/workflows/r12-real-multi-agent-pilot.yml'
      - 'scripts/validate-agent-protocol.py'
      - 'schemas/agent-handoff.schema.json'
      - 'schemas/task-packet.schema.json'
      - 'schemas/orchestration-state.schema.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, blueprint]

    steps:
      - name: Checkout evidence plane
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0 PyYAML==6.0.2

      - name: Validate R12 governed chain
        run: python pilots/R12/validate-r12.py
