version: 0.1.0
gates:
  - id: api_gate
    name: API Gate
    phase: api_gate
    blocks: [interface_inventory, visual_identity, mockups, web_implementation, android_implementation]
    require_all:
      - api.endpoints_implemented
      - api.auth_authorization
      - api.audit_logging
      - api.openapi
      - api.postman_collection
      - api.postman_environment
      - api.qa_positive
      - api.qa_negative
      - api.contract_validation
    result_values: [PASS, FAIL, BLOCKED]
    rule: >-
      No se inicia diseño visual ni implementación de clientes web/Android
      mientras este gate no esté en PASS.

  - id: release_gate
    name: Release Gate
    phase: release_gate
    require_all:
      - qa.integration
      - qa.security
      - release.documentation
    require_if_applicable:
      - release.backup_restore
    result_values: [PASS, FAIL, BLOCKED]
