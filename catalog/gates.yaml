version: 0.5.1
gates:
  - id: brownfield_baseline
    name: Brownfield Baseline Gate
    phase: target_definition
    mode: brownfield
    blocks: [requirements_domain, architecture_security_data, api_contract_design, api_implementation]
    require_all:
      - brownfield.technical_inventory
      - brownfield.functional_reconstruction
      - brownfield.gap_analysis
      - brownfield.target_definition
      - brownfield.alignment_roadmap
    result_values: [READY_FOR_REVIEW, PASS, FAIL, BLOCKED]

  - id: requirements_ready
    name: Requirements Ready Gate
    phase: requirements_domain
    blocks: [interface_scope_baseline, architecture_security_data, api_contract_design, api_implementation]
    require_all:
      - requirements.actors_authorization
      - requirements.functional
      - requirements.non_functional
      - requirements.business_rules
      - requirements.use_cases
      - requirements.acceptance_criteria
      - requirements.traceability
    result_values: [READY_FOR_REVIEW, PASS, FAIL, BLOCKED]

  - id: interface_scope_ready
    name: Interface Scope Baseline Ready
    phase: interface_scope_baseline
    evaluation_scope: project
    blocks: [architecture_security_data, api_contract_design]
    require_all:
      - ui.interface_scope_baseline
      - ui.interface_scope_traceability
    require_if_applicable:
      - ui.brownfield_observed_interface_scope
    result_values: [READY_FOR_REVIEW, PASS, FAIL, BLOCKED]
    rule: >-
      Establish the descriptive interface scope before API design without pretending the
      authoritative API bindings already exist. Brownfield must preserve observed client
      behavior; Greenfield derives intent from approved requirements. This gate does not
      authorize client implementation or substitute Interface Inventory Ready.

  - id: architecture_ready
    name: Architecture Ready Gate
    phase: architecture_security_data
    blocks: [api_contract_design, api_implementation]
    require_all:
      - architecture.domain_model
      - architecture.decision_records
      - architecture.security_model
      - data.architecture
      - data.schema_migrations
      - data.authoritative_database
      - audit.event_catalog
      - audit.retention_policy
      - api.auth_strategy
      - api.error_contract
      - api.versioning_policy
    require_if_applicable: [architecture.threat_model]
    result_values: [READY_FOR_REVIEW, PASS, FAIL, BLOCKED]

  - id: api_contract_ready
    name: API Contract Ready Gate
    phase: api_contract_design
    blocks: [api_implementation]
    require_all:
      - api.scope_defined
      - api.endpoint_inventory
      - api.auth_contract
      - api.permission_matrix
      - api.audit_event_mapping
      - api.idempotency_matrix
      - api.contract_traceability
    require_if_applicable:
      - api.change_impact_analysis
    result_values: [READY_FOR_REVIEW, PASS, FAIL, BLOCKED]
    rule: >-
      No endpoint implementation begins until scope, payload intent, authorization,
      audit mapping, idempotency and traceability are explicit. After an API baseline has
      client consumers, every contract change with possible downstream impact must also
      identify affected operationIds/slices or justify broader impact scope.

  - id: api_implemented
    name: API Implemented Gate
    phase: api_implementation
    blocks: [openapi_validation, postman_contract, api_qa]
    require_all:
      - api.endpoints_implemented
      - api.auth_authorization
      - api.audit_logging
      - api.backend_tests
      - api.architecture_implementation_conformance
    result_values: [READY_FOR_REVIEW, PASS, FAIL, BLOCKED]
    rule: >-
      Functional correctness does not prove architectural correctness. PASS requires
      evidence that the implementation conforms to the approved architecture contract,
      including dependency direction, module/layer boundaries, Presentation/Application/
      Domain/Infrastructure responsibilities and declared ports/adapters where applicable.
      Prefer executable architecture assertions; when a constraint cannot be automated,
      record explicit review evidence rather than silently treating it as satisfied.

  - id: openapi_valid
    name: OpenAPI Valid Gate
    phase: openapi_validation
    blocks: [postman_contract, api_qa]
    require_all:
      - api.openapi
      - api.openapi_validation
    result_values: [READY_FOR_REVIEW, PASS, FAIL, BLOCKED]

  - id: postman_ready
    name: Postman Ready Gate
    phase: postman_contract
    blocks: [api_qa]
    require_all:
      - api.postman_collection
      - api.postman_environment
      - api.postman_coverage
    result_values: [READY_FOR_REVIEW, PASS, FAIL, BLOCKED]

  - id: api_qa_pass
    name: API QA Pass Gate
    phase: api_qa
    blocks: [api_gate]
    require_all:
      - api.qa_positive
      - api.qa_negative
      - api.contract_validation
      - api.security_qa
      - api.audit_qa
    require_if_applicable:
      - api.affected_consumer_revalidation
    result_values: [READY_FOR_REVIEW, PASS, FAIL, BLOCKED]
    rule: >-
      Initial API QA proves the project baseline. For later API changes, downstream
      revalidation is impact-based: operationId-scoped changes revalidate affected slices;
      auth, authorization, security, error-contract or other cross-cutting changes may
      escalate to platform or project scope.

  - id: api_gate
    name: API Gate
    phase: api_gate
    evaluation_scope: project
    blocks:
      - interface_inventory
      - visual_identity
      - design_system
      - mockup_planning
      - mockups
      - mockup_review
      - client_architecture
      - functional_interface_slice
      - web_implementation
      - android_implementation
      - visual_functional_review
      - integration_qa
    require_all:
      - api.endpoints_implemented
      - api.auth_authorization
      - api.audit_logging
      - api.backend_tests
      - api.architecture_implementation_conformance
      - api.openapi
      - api.openapi_validation
      - api.postman_collection
      - api.postman_environment
      - api.postman_coverage
      - api.qa_positive
      - api.qa_negative
      - api.contract_validation
      - api.security_qa
      - api.audit_qa
    result_values: [READY_FOR_REVIEW, PASS, FAIL, BLOCKED]
    rule: >-
      Project-scoped initial API baseline. No executable client delivery begins until this
      gate is PASS. The gate aggregates both behavioral/API evidence and architecture
      implementation conformance; passing runtime tests cannot substitute for the latter.
      Later API changes do not automatically invalidate unrelated accepted evidence;
      impact analysis and dependency bindings determine the required revalidation scope.
      Cross-cutting security/auth/contract changes may invalidate broader scopes. The API
      remains the authoritative security and business boundary.

  - id: interface_inventory_ready
    name: Interface Inventory Ready Gate
    phase: interface_inventory
    evaluation_scope: project
    blocks:
      - visual_identity
      - design_system
      - mockup_planning
      - mockups
      - mockup_review
      - client_architecture
      - functional_interface_slice
      - web_implementation
      - android_implementation
      - visual_functional_review
      - integration_qa
    require_all:
      - ui.inventory_scope_complete
      - ui.inventory_traceability
      - ui.inventory_requirement_links
      - ui.inventory_permission_links
      - ui.inventory_operation_links
      - ui.inventory_dependencies
      - ui.inventory_slice_backlog
    require_if_applicable:
      - ui.web_inventory
      - ui.android_inventory
      - ui.brownfield_observed_proposed_separation
    result_values: [READY_FOR_REVIEW, PASS, FAIL, BLOCKED]
    rule: >-
      Reconcile the approved Interface Scope Baseline against the authoritative API and
      produce the complete committed executable backlog. API-backed data/actions use
      canonical operationIds; legitimate local/static behavior may explicitly declare no
      API operation. Missing authoritative behavior must not be invented to complete it.

  - id: design_system_ready
    name: Design System Ready Gate
    phase: design_system
    evaluation_scope: project
    blocks:
      - mockup_planning
      - mockups
      - mockup_review
      - client_architecture
      - functional_interface_slice
      - web_implementation
      - android_implementation
      - visual_functional_review
      - integration_qa
    require_all:
      - design.system
      - design.tokens
      - design.accessibility
      - design.responsive
      - design.semantic_states
    require_if_applicable: [design.identity, design.logo]
    result_values: [READY_FOR_REVIEW, PASS, FAIL, BLOCKED]
    rule: >-
      Functional clients and optional visual prototypes share the same evidence-backed
      Design System. Visual Identity is conditional and a custom logo is never fabricated
      solely to satisfy this gate.

  - id: mockup_review_pass
    name: Mockup / Prototype Review Pass
    phase: mockup_review
    evaluation_scope: interface_slice
    require_all:
      - mockups.inventory_preexists
      - mockups.plan
      - mockups.batch_limit
      - mockups.contract_traceability
      - mockups.visuals_generated
      - mockups.assets_versioned
      - mockups.asset_mapping
      - mockups.review_complete
      - mockups.contract_review
      - mockups.accessibility_review
      - mockups.approved_references
      - mockups.no_implicit_approval
    require_if_applicable: [mockups.reference_inputs]
    result_values: [READY_FOR_REVIEW, PASS, FAIL, BLOCKED]
    rule: >-
      Conditional gate used only when mockups/prototypes are intentionally produced.
      GENERATED is not REVIEWED and REVIEWED is not APPROVED. Blueprint core does not
      universally require this gate before Client Architecture. A consumer may declare
      it mandatory for a specific slice when prior visual approval is a real requirement.

  - id: client_architecture_ready
    name: Client Architecture Ready Gate
    phase: client_architecture
    evaluation_scope: interface_slice_platform
    blocks: [functional_interface_slice, web_implementation, android_implementation]
    require_all:
      - client.architecture_contract
      - client.visual_contract_binding
      - client.auth_lifecycle
      - client.api_client_strategy
      - client.api_contract_binding
      - client.authorization_presentation
      - client.routing_navigation
      - client.state_cache_strategy
      - client.forms_validation
      - client.async_error_offline
      - client.idempotency_strategy
      - client.observability_correlation
      - client.accessibility
      - client.testing_strategy
      - client.platform_contract
    require_if_applicable: [client.brownfield_coexistence]
    result_values: [READY_FOR_REVIEW, PASS, FAIL, BLOCKED]
    rule: >-
      Evaluate independently for the exact interface slice + platform. The effective
      contract is composed from a reusable Platform Client Architecture Baseline plus a
      slice-specific binding/override. Design System, tokens and authoritative API bindings
      are mandatory; static approved visual references are conditional inputs, not a
      universal prerequisite. API authorization remains authoritative and Brownfield
      coexistence remains explicit.

  - id: functional_slice_ready
    name: Functional Interface Slice Ready
    phase: functional_interface_slice
    evaluation_scope: interface_slice_platform
    blocks: [visual_functional_review, integration_qa]
    require_all:
      - functional.inventory_binding
      - functional.api_dependencies_resolved
      - functional.real_api_integration
      - functional.no_hardcoded_business_data
      - functional.no_invented_capabilities
      - functional.auth_rbac_runtime
      - functional.forms_error_states
      - functional.observability_runtime
      - functional.responsive_runtime
      - functional.accessibility_runtime
      - functional.tests
      - functional.traceability
    require_if_applicable: [functional.idempotency_runtime]
    result_values: [READY_FOR_REVIEW, PASS, FAIL, BLOCKED]
    rule: >-
      PASS authorizes lifecycle state FUNCTIONAL for the exact slice + platform.
      Authoritative business data and mutations must use the real approved API/data
      source. An unresolved server-contract gap creates a BLOCKED_BY_API overlay while
      preserving the slice lifecycle state; hardcoded business truth is never a fallback.

  - id: visual_functional_review_pass
    name: Visual & Functional Review Pass
    phase: visual_functional_review
    evaluation_scope: interface_slice_platform
    blocks: [integration_qa]
    require_all:
      - review.interface_fidelity
      - review.design_system_fidelity
      - review.api_permission_fidelity
      - review.business_data_fidelity
      - review.interaction_states
      - review.responsive
      - review.accessibility
      - review.human_complete
    require_if_applicable: [review.reference_comparison]
    result_values: [READY_FOR_REVIEW, PASS, FAIL, BLOCKED]
    rule: >-
      Review the actual functional client that will ship, not only static images.
      Approved mockups/prototypes are comparison inputs when they exist. Human review
      is explicit and cannot be inferred from implementation or CI success.

  - id: integration_qa_pass
    name: Integration QA Pass
    phase: integration_qa
    evaluation_scope: interface_slice_platform
    require_all:
      - qa.functional
      - qa.real_api_transport
      - qa.integration
      - qa.security
      - qa.responsive
      - qa.accessibility
      - qa.e2e
    require_if_applicable: [qa.idempotency, qa.offline]
    result_values: [READY_FOR_REVIEW, PASS, FAIL, BLOCKED]
    rule: >-
      PASS applies only to the evaluated slice + platform. Release readiness requires
      aggregation of every committed slice required by the release; one slice cannot
      unlock the project Release Gate by itself.

  - id: release_gate
    name: Release Gate
    phase: release_gate
    require_all:
      - release.functional_slices_accepted
      - release.security_accepted
      - release.documentation
    require_if_applicable: [release.backup_restore]
    result_values: [READY_FOR_REVIEW, PASS, FAIL, BLOCKED]
    rule: >-
      Release only after all committed Functional Interface Slices required by the
      release have passed their scoped review/integration obligations and explicit
      acceptance is evidenced.
