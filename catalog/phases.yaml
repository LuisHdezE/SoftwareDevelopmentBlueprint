version: 0.4.0
phases:
  - id: discovery
    name: Discovery
    applies_to: [greenfield]
    order: 10
  - id: brownfield_inspection
    name: Brownfield Inspection
    applies_to: [brownfield]
    order: 10
  - id: as_is
    name: AS-IS Reconstruction
    applies_to: [brownfield]
    order: 20
  - id: gap_analysis
    name: Gap Analysis
    applies_to: [brownfield]
    order: 30
  - id: target_definition
    name: TO-BE / Target Definition
    applies_to: [greenfield, brownfield]
    order: 40
  - id: requirements_domain
    name: Requirements & Domain
    applies_to: [greenfield, brownfield]
    order: 50
  - id: architecture_security_data
    name: Architecture, Security & Data
    applies_to: [greenfield, brownfield]
    order: 60
  - id: api_contract_design
    name: API Scope & Contract Design
    applies_to: [greenfield, brownfield]
    order: 70
  - id: api_implementation
    name: API Implementation
    applies_to: [greenfield, brownfield]
    order: 80
  - id: openapi_validation
    name: OpenAPI Formalization & Validation
    applies_to: [greenfield, brownfield]
    order: 90
  - id: postman_contract
    name: Postman Operational Contract
    applies_to: [greenfield, brownfield]
    order: 100
  - id: api_qa
    name: API QA & Contract Validation
    applies_to: [greenfield, brownfield]
    order: 110
  - id: api_gate
    name: API Gate
    applies_to: [greenfield, brownfield]
    order: 120

  - id: interface_inventory
    name: Interface Inventory
    applies_to: [greenfield, brownfield]
    order: 130
    requires_gates: [api_gate]
    exit_gate: interface_inventory_ready

  - id: visual_identity
    name: Visual Identity
    applies_to: [greenfield, brownfield]
    order: 140
    requires_gates: [interface_inventory_ready]

  - id: design_system
    name: Design System
    applies_to: [greenfield, brownfield]
    order: 150
    requires_phases: [visual_identity]
    requires_gates: [interface_inventory_ready]
    exit_gate: design_system_ready

  - id: mockup_planning
    name: Mockup Planning
    applies_to: [greenfield, brownfield]
    order: 160
    execution_scope: interface_slice
    requires_gates: [design_system_ready]

  - id: mockups
    name: Mockup Generation
    applies_to: [greenfield, brownfield]
    order: 170
    execution_scope: interface_slice
    requires_phases: [mockup_planning]
    max_images_per_batch: 10

  - id: visual_review_gate
    name: Visual Review Gate
    applies_to: [greenfield, brownfield]
    order: 180
    execution_scope: interface_slice
    requires_phases: [mockups]
    exit_gate: visual_review_pass

  - id: client_architecture
    name: Client Architecture
    applies_to: [greenfield, brownfield]
    order: 190
    execution_scope: interface_slice_platform
    requires_gates: [visual_review_pass]
    exit_gate: client_architecture_ready

  - id: web_implementation
    name: React Web Implementation
    applies_to: [greenfield, brownfield]
    order: 200
    execution_scope: interface_slice
    conditional_capability: web
    requires_gates: [client_architecture_ready]

  - id: android_implementation
    name: Kotlin Android Implementation
    applies_to: [greenfield, brownfield]
    order: 210
    execution_scope: interface_slice
    conditional_capability: android
    requires_gates: [client_architecture_ready]

  - id: integration_qa
    name: Integration & System QA
    applies_to: [greenfield, brownfield]
    order: 220

  - id: release_gate
    name: Release Gate
    applies_to: [greenfield, brownfield]
    order: 230

  - id: operations
    name: Operations & Maintenance
    applies_to: [greenfield, brownfield]
    order: 240
