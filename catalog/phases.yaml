version: 0.5.1-dev
phases:
  - id: discovery
    name: Discovery
    applies_to: [greenfield]
    order: 10
  - id: brownfield_inspection
    name: Brownfield Inspection
    applies_to: [brownfield]
    order: 10
  - id: as_is
    name: AS-IS Reconstruction
    applies_to: [brownfield]
    order: 20
  - id: gap_analysis
    name: Gap Analysis
    applies_to: [brownfield]
    order: 30
  - id: target_definition
    name: TO-BE / Target Definition
    applies_to: [greenfield, brownfield]
    order: 40
  - id: requirements_domain
    name: Requirements & Domain
    applies_to: [greenfield, brownfield]
    order: 50

  - id: interface_scope_baseline
    name: Interface Scope Baseline
    applies_to: [greenfield, brownfield]
    order: 55
    requires_gates: [requirements_ready]
    exit_gate: interface_scope_ready
    rule: >-
      Early descriptive/planning boundary. Brownfield records observed interfaces from
      AS-IS and reconciled requirements; Greenfield derives intended interface scope from
      approved requirements and journeys. Unresolved API needs are allowed here. This
      baseline is not an executable client backlog and never authorizes UI implementation.

  - id: architecture_security_data
    name: Architecture, Security & Data
    applies_to: [greenfield, brownfield]
    order: 60
    rule: >-
      Architecture decisions must be precise enough to verify in implementation. Define
      dependency direction, framework/persistence boundaries, presentation responsibilities,
      module boundaries and port/adapter obligations when applicable. Naming an architecture
      style without verifiable implementation constraints is insufficient for Architecture Ready.
  - id: api_contract_design
    name: API Scope & Contract Design
    applies_to: [greenfield, brownfield]
    order: 70
  - id: api_implementation
    name: API Implementation
    applies_to: [greenfield, brownfield]
    order: 80
    rule: >-
      Functional correctness is necessary but not sufficient. The implementation revision
      must conform to the approved architecture constraints and carry an executable CI guard
      that detects dependency/boundary drift before API Implemented can PASS.
  - id: openapi_validation
    name: OpenAPI Formalization & Validation
    applies_to: [greenfield, brownfield]
    order: 90
  - id: postman_contract
    name: Postman Operational Contract
    applies_to: [greenfield, brownfield]
    order: 100
  - id: api_qa
    name: API QA & Contract Validation
    applies_to: [greenfield, brownfield]
    order: 110
  - id: api_gate
    name: API Gate
    applies_to: [greenfield, brownfield]
    order: 120

  - id: interface_inventory
    name: Interface Inventory
    applies_to: [greenfield, brownfield]
    order: 130
    requires_gates: [api_gate, interface_scope_ready]
    exit_gate: interface_inventory_ready
    rule: >-
      Reconcile the early Interface Scope Baseline with the authoritative API contract
      and produce the complete executable client backlog. API-backed data/actions bind to
      canonical operationIds; legitimate local/static behavior is declared explicitly.

  - id: visual_identity
    name: Visual Identity
    applies_to: [greenfield, brownfield]
    order: 140
    applicability: CONDITIONAL
    requires_gates: [interface_inventory_ready]
    rule: >-
      Use when brand/identity decisions are a real product need or when Brownfield
      identity must be preserved or normalized. It is not a mandatory branding exercise.

  - id: design_system
    name: Design System
    applies_to: [greenfield, brownfield]
    order: 150
    requires_gates: [interface_inventory_ready]
    exit_gate: design_system_ready

  - id: mockup_planning
    name: Mockup / Prototype Planning
    applies_to: [greenfield, brownfield]
    order: 155
    applicability: CONDITIONAL
    execution_scope: interface_slice
    requires_gates: [design_system_ready]

  - id: mockups
    name: Mockup / Prototype Generation
    applies_to: [greenfield, brownfield]
    order: 156
    applicability: CONDITIONAL
    execution_scope: interface_slice
    requires_phases: [mockup_planning]
    max_images_per_batch: 10

  - id: mockup_review
    name: Mockup / Prototype Review
    applies_to: [greenfield, brownfield]
    order: 157
    applicability: CONDITIONAL
    execution_scope: interface_slice
    requires_phases: [mockups]
    exit_gate: mockup_review_pass

  - id: client_architecture
    name: Client Architecture
    applies_to: [greenfield, brownfield]
    order: 160
    execution_scope: interface_slice_platform
    requires_gates: [interface_inventory_ready, design_system_ready]
    exit_gate: client_architecture_ready

  - id: functional_interface_slice
    name: Functional Interface Slice
    applies_to: [greenfield, brownfield]
    order: 170
    execution_scope: interface_slice_platform
    requires_gates: [client_architecture_ready]
    exit_gate: functional_slice_ready
    rule: >-
      Canonical client execution unit. Implementation is performed through the
      applicable web or Android profile and can become FUNCTIONAL only after the
      functional Definition of Done is evidenced.

  - id: web_implementation
    name: React Web Implementation Profile
    applies_to: [greenfield, brownfield]
    order: 171
    execution_scope: interface_slice_platform
    parent_phase: functional_interface_slice
    conditional_capability: web
    requires_gates: [client_architecture_ready]

  - id: android_implementation
    name: Kotlin Android Implementation Profile
    applies_to: [greenfield, brownfield]
    order: 172
    execution_scope: interface_slice_platform
    parent_phase: functional_interface_slice
    conditional_capability: android
    requires_gates: [client_architecture_ready]

  - id: visual_functional_review
    name: Visual & Functional Review
    applies_to: [greenfield, brownfield]
    order: 180
    execution_scope: interface_slice_platform
    requires_gates: [functional_slice_ready]
    exit_gate: visual_functional_review_pass

  - id: integration_qa
    name: Integration & System QA
    applies_to: [greenfield, brownfield]
    order: 190
    execution_scope: interface_slice_platform
    requires_gates: [visual_functional_review_pass]
    exit_gate: integration_qa_pass

  - id: release_gate
    name: Release Gate
    applies_to: [greenfield, brownfield]
    order: 200

  - id: operations
    name: Operations & Maintenance
    applies_to: [greenfield, brownfield]
    order: 210
