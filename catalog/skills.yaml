version: 0.5.3-dev

skill_model:
  principles:
    - skills_are_versioned_with_blueprint
    - load_only_relevant_skills
    - project_specific_knowledge_stays_in_project
    - skills_reference_canonical_docs_instead_of_duplicating_them
    - materialized_skills_must_resolve_to_repository_files
    - generated_or_product_specific_knowledge_must_not_leak_into_dev_skills
  contract:
    root_pattern: skills/<skill-id>/SKILL.md
    required_frontmatter:
      - id
      - title
      - version
      - status
      - category
      - applies_to
      - phases
      - canonical_references
    required_sections:
      - Purpose
      - When to Use
      - Inputs
      - Procedure
      - Outputs
      - Stop Conditions
      - Guardrails
      - Canonical References
      - Completion Signal
    statuses:
      - materialized
      - planned

categories:
  core:
    always_consider:
      - dev-git-workflow
      - dev-code-review
      - dev-debugging
      - dev-refactoring
      - dev-security-baseline
      - dev-database-design
      - dev-testing-strategy
      - dev-event-logging-audit
      - dev-documentation

  backend:
    conditional_on:
      backend: laravel
    skills:
      - dev-laravel-setup
      - dev-api-design
      - dev-backend-security
      - dev-database-migration
      - dev-ddd-tactical-patterns
      - dev-openapi
      - dev-postman-qa
      - dev-contract-testing

  web:
    conditional_on:
      web: true
    skills:
      - dev-react
      - dev-react-client-architecture
      - dev-functional-interface-slice
      - dev-tailwind
      - dev-accessibility
      - dev-web-view-inventory
      - dev-design-system
      - dev-mockup-planning

  android:
    conditional_on:
      android: true
    skills:
      - dev-android-kotlin
      - dev-android-client-architecture
      - dev-functional-interface-slice
      - dev-jetpack-compose
      - dev-mobile-security
      - dev-android-view-inventory

  mobile_licensing:
    conditional_on:
      mobile_licensing: true
    skills:
      - dev-mobile-licensing

  saas:
    conditional_on:
      saas: true
    skills:
      - dev-saas
      - dev-multi-tenancy
      - dev-tenant-security

  brownfield:
    conditional_on:
      mode: brownfield
    skills:
      - dev-brownfield-analysis
      - dev-gap-analysis
      - dev-migration-planning

  devops:
    skills:
      - dev-ci-cd
      - dev-deployment
    conditional:
      docker:
        capability: docker
        skills: [dev-docker]

