sources_for_initial_audit:
  - repository: LuisHdezE/VolquetasManager
    path: .agents/skills
    rule: >-
      Reutilizar solamente conocimiento genérico después de eliminar referencias
      específicas del producto. Las skills del proyecto sirven como cantera/patrón,
      no como fuente normativa del Blueprint.
