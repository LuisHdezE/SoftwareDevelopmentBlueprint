{
  "openapi": "3.0.3",
  "info": {
    "title": "Blueprint synthetic reference API",
    "version": "1.1.0"
  },
  "paths": {
    "/health": {
      "get": {
        "operationId": "health_get",
        "responses": {
          "200": {
            "description": "Success"
          }
        }
      }
    },
    "/auth/login": {
      "post": {
        "operationId": "auth_login",
        "responses": {
          "200": {
            "description": "Success"
          },
          "401": {
            "description": "Expected error"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "username",
                  "password"
                ],
                "properties": {
                  "username": {
                    "type": "string"
                  },
                  "password": {
                    "type": "string"
                  }
                }
              }
            }
          }
        }
      }
    },
    "/items": {
      "post": {
        "operationId": "items_create",
        "responses": {
          "201": {
            "description": "Success"
          },
          "400": {
            "description": "Expected error"
          },
          "401": {
            "description": "Expected error"
          },
          "403": {
            "description": "Expected error"
          },
          "409": {
            "description": "Expected error"
          },
          "422": {
            "description": "Expected error"
          }
        },
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "name"
                ],
                "properties": {
                  "name": {
                    "type": "string"
                  }
                }
              }
            }
          }
        }
      }
    },
    "/items/{id}": {
      "get": {
        "operationId": "items_get",
        "responses": {
          "200": {
            "description": "Success"
          },
          "401": {
            "description": "Expected error"
          },
          "404": {
            "description": "Expected error"
          }
        },
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ]
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer"
      }
    }
  }
}
