schema_version: 0.5.3-dev
orchestrator: github_actions
strategy: self_hosted
runner:
  scope: repository
  labels:
    - self-hosted
    - linux
    - x64
    - blueprint
  os: linux
  arch: x64
  persistent: true
  service_containers: true
  container_engine: docker
  project_docker_capability_independent: true
services:
  isolation: per_job
  lifecycle: ephemeral
  host_port_policy: dynamic
  runtime_port_discovery: github_actions_service_context
  shared_image_cache: true
  shared_runtime_instances: false
  healthcheck_required: true
  catalog:
    mysql:
      image: mysql:8.4
      container_port: 3306
    postgresql:
      image: postgres:16
      container_port: 5432
    redis:
      image: redis:8.10.1
      container_port: 6379
security:
  trusted_code_only: true
  fork_pull_requests: deny
  persistent_secrets: false
  least_privilege_permissions: true
evidence:
  exact_head_required: true
  check_run_required: true
  pre_execution_infrastructure_failures_distinct_from_test_failures: true
maintenance:
  workspace_cleanup: true
  runner_updates: automatic
notes: >-
  0.5.3-dev self-hosted Linux x64 example. Docker images may be shared and
  cached by the host, but MySQL, PostgreSQL and Redis runtime instances are
  isolated and ephemeral per job. Workflows use dynamically assigned host
  ports and discover them through the GitHub Actions service context. Runner
  container infrastructure remains independent from the consumer project's
  Docker capability.
