project:
  name: Example Project
  repository: owner/repository
  description: Example Blueprint-enabled project

blueprint:
  version: 0.3.0
  mode: brownfield

stack:
  backend: laravel
  database: mysql
  frontend: react
  styling: tailwind
  mobile: kotlin

capabilities:
  web: true
  android: true
  saas: false
  multi_tenant: false
  offline_mobile: false
  redis: false
  docker: false

artifact_locations:
  status: .blueprint/status.yaml
  evidence_root: .blueprint/evidence
  interface_inventory: .blueprint/ui/interface-inventory.json
  visual_identity: .blueprint/ui/visual-identity.md
  design_system: .blueprint/ui/design-system.json
  design_tokens: .blueprint/ui/design-tokens.json
  mockups_root: .blueprint/mockups
  client_architecture_root: .blueprint/client-architecture

skills:
  profiles:
    - core
    - backend
    - web
    - android
    - brownfield
