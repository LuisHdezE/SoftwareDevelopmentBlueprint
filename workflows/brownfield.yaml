version: 0.4.0
mode: brownfield
entry_condition: existing_solution
sequence:
  - brownfield_inspection
  - as_is
  - gap_analysis
  - target_definition
  - requirements_domain
  - architecture_security_data
  - api_contract_design
  - api_implementation
  - openapi_validation
  - postman_contract
  - api_qa
  - api_gate
  - interface_inventory
  - visual_identity
  - design_system
  - mockup_planning
  - mockups
  - visual_review_gate
  - client_architecture
  - web_implementation
  - android_implementation
  - integration_qa
  - release_gate
  - operations
gates:
  after_target_definition: brownfield_baseline
  after_requirements_domain: requirements_ready
  after_architecture_security_data: architecture_ready
  after_api_contract_design: api_contract_ready
  after_api_implementation: api_implemented
  after_openapi_validation: openapi_valid
  after_postman_contract: postman_ready
  after_api_qa: api_qa_pass
  before_experience_pipeline: api_gate
  after_interface_inventory: interface_inventory_ready
  after_design_system: design_system_ready
  per_interface_slice_after_visual_review: visual_review_pass
  per_interface_slice_platform_before_implementation: client_architecture_ready
  before_release: release_gate
interface_slice_pipeline:
  scope_key: interface_slice
  sequence:
    - mockup_planning
    - mockups
    - visual_review_gate
    - client_architecture
    - client_implementation
  client_implementation:
    web: web_implementation
    android: android_implementation
  rules:
    - slice_must_reference_inventory_ids
    - visual_review_pass_is_scoped_to_slice
    - client_architecture_ready_is_scoped_to_slice_and_platform
    - approved_slice_may_progress_without_waiting_for_all_product_views
    - unapproved_views_must_not_enter_client_implementation
rules:
  - describe_existing_state_before_proposing_changes
  - distinguish_observed_inferred_and_proposed_items
  - do_not_rewrite_only_for_architectural_aesthetics
  - preserve_existing_working_behavior_unless_change_is_justified
  - identify_documentation_drift
  - inventory_existing_api_ui_tests_security_and_dependencies
  - produce_as_is_gap_analysis_and_to_be_before_alignment_work
  - requirements_ready_must_pass_before_api_design_or_implementation
  - architecture_ready_must_pass_before_api_contract_design
  - api_contract_ready_must_pass_before_api_implementation
  - api_gate_must_pass_before_experience_pipeline
  - interface_inventory_ready_must_pass_before_visual_identity_or_design_system
  - design_system_ready_must_pass_before_mockup_planning
  - mockups_require_view_inventory
  - max_10_mockups_per_generation
  - generated_visual_is_not_approved_visual
  - approved_visual_assets_must_be_versioned_and_reusable_by_future_ai
  - ui_must_not_invent_api_permissions_states_or_mutations
  - api_remains_authorization_boundary
  - visual_review_pass_must_apply_to_each_implemented_interface_slice
  - client_architecture_ready_must_apply_to_each_target_platform_slice
  - brownfield_client_coexistence_must_be_explicit_before_replacement
pilot:
  repository: LuisHdezE/CareShift_Manager
  role: reference_pilot
  normative: false
